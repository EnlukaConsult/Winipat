<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Winniepat</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0B1020;
        color: #E7EAF6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
      }
      .logo { width: 96px; height: 96px; border-radius: 22px; }
      h1 { font-size: 20px; margin: 8px 0 0; }
      p { color: #9aa3c7; font-size: 14px; max-width: 280px; line-height: 1.5; }
      button {
        margin-top: 8px;
        background: #3C4FE0;
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 12px 24px;
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <!-- Shown only when the live site can't be reached (offline). The native
         shell normally loads winipat.com directly. -->
    <div class="wrap">
      <img class="logo" src="icons/icon-192.png" alt="Winniepat" />
      <h1>You're offline</h1>
      <p>Winniepat needs an internet connection. Check your network and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
